[project]
name = "guppi-agent"
version = "0.1.0"
description = "GuppiGPT agent: AG-UI over SSE on the AgentCore Runtime contract"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=0.1.22",
    "ag-ui-strands>=0.3.0",
    "aws-opentelemetry-distro>=0.18.0",
    "boto3>=1.43.87",
    "fastapi>=0.115",
    "strands-agents>=1.54.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Repository = "https://github.com/samdengler/guppi-gpt"

# The kit a project agent depends on by git URL, pinned to a tag (docs/proposals/platform.md):
#   guppi-agent @ git+https://github.com/samdengler/guppi-gpt@<tag>#subdirectory=agent
# The wheel carries src/guppi_agent only; the Dockerfile still installs from uv.lock.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guppi_agent"]
