[project]
name = "guppi-mcp-app-infra"
version = "0.1.0"
description = "AWS CDK app for guppi-mcp-app"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.230",
    "constructs>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guppi_mcp_app_infra"]
