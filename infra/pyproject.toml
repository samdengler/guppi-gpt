[project]
name = "guppi-gpt-infra"
version = "0.1.0"
description = "AWS CDK app for GuppiGPT"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.230",
    "constructs>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guppi_gpt_infra"]
