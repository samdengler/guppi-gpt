[package]
name = "obo-issuer"
version = "0.1.0"
edition = "2024"
publish = false
description = "On-behalf-of token issuer, RFC 8693 (guppi-hr D47, D51)"

[[bin]]
name = "obo-issuer"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
base64 = "0.22"
form_urlencoded = "1"
futures = "0.3"
lambda_runtime = "1"
num-bigint = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Key generation in the tests is slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
