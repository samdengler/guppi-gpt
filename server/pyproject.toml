[project]
name = "mcp-app-server"
version = "0.1.0"
description = "The guppi-mcp-app MCP server: show_card and its ui:// resource"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_app_server"]
